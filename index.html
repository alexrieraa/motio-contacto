<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Formulario de contacto de MOTIO.">
  <title>Contacto | MOTIO</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --panel:#191b1f; --line:#34363b; --text:#f9f8f4; --muted:#a7a8ae; --focus:#a9b6c8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(100% - 36px, 680px); margin:0 auto; padding:clamp(48px,8vh,96px) 0 64px; }
    header { text-align:center; margin-bottom:42px; }
    .brand { font-size:clamp(32px,6vw,42px); letter-spacing:.21em; font-weight:800; margin:0 0 21px; padding-left:.21em; }
    h1 { margin:0 0 10px; font-size:clamp(23px,4vw,29px); font-weight:650; letter-spacing:-.025em; }
    .intro { margin:0; color:var(--muted); font-size:15px; line-height:1.6; }
    form { display:grid; gap:22px; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .field { display:flex; flex-direction:column; gap:9px; }
    label { font-size:13px; font-weight:600; color:#e4e4e6; }
    .optional { color:var(--muted); font-size:12px; font-weight:400; }
    input, textarea { width:100%; font:inherit; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:11px; padding:15px 16px; outline:none; transition:border-color .18s,box-shadow .18s; }
    input::placeholder, textarea::placeholder { color:#85868d; }
    input:focus, textarea:focus { border-color:var(--focus); box-shadow:0 0 0 3px rgba(169,182,200,.14); }
    textarea { resize:vertical; min-height:148px; line-height:1.5; }
    button { width:100%; margin-top:3px; padding:17px; border:0; border-radius:11px; background:#f9f8f4; color:#141518; font:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:background .2s,transform .2s; }
    button:hover { background:#dfe3e8; }
    button:active { transform:scale(.99); }
    button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .notice { margin:0; color:var(--muted); line-height:1.6; font-size:12px; text-align:center; }
    .trap { position:absolute; left:-9999px; opacity:0; pointer-events:none; }
    @media (max-width:520px) { .two { grid-template-columns:1fr; gap:22px; } header { margin-bottom:34px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">MOTIO</p>
      <h1>Contacta con nosotros</h1>
      <p class="intro">¿Tienes alguna duda, sugerencia o incidencia? Envíanos un mensaje.</p>
    </header>
    <form action="https://formsubmit.co/alexrieraaautia@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Nuevo contacto desde MOTIO">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="two">
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" name="Nombre" type="text" placeholder="Tu nombre" autocomplete="given-name" maxlength="80" required></div>
        <div class="field"><label for="apellidos">Apellidos</label><input id="apellidos" name="Apellidos" type="text" placeholder="Tus apellidos" autocomplete="family-name" maxlength="120" required></div>
      </div>
      <div class="two">
        <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" placeholder="nombre@ejemplo.com" autocomplete="email" maxlength="254" required></div>
        <div class="field"><label for="telefono">Teléfono <span class="optional">(opcional)</span></label><input id="telefono" name="Teléfono" type="tel" placeholder="Tu número de teléfono" autocomplete="tel" maxlength="30"></div>
      </div>
      <div class="field"><label for="asunto">Asunto</label><input id="asunto" name="Asunto" type="text" placeholder="¿En qué podemos ayudarte?" maxlength="150" required></div>
      <div class="field"><label for="mensaje">Mensaje</label><textarea id="mensaje" name="Mensaje" placeholder="Escribe aquí tu consulta..." maxlength="5000" required></textarea></div>
      <button type="submit">Enviar mensaje</button>
      <p class="notice">Los datos que facilites se utilizarán para atender tu consulta y se enviarán mediante FormSubmit al correo de contacto de MOTIO. No incluyas contraseñas ni información sensible.</p>
    </form>
  </main>
</body>
</html>
